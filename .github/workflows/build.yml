name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release on a tag
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags + history for the release notes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # compileSdk 36; the runner image may only ship older platforms
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Release key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew test assembleRelease -PversionNameOverride="${GITHUB_REF_NAME#v}"
          else
            ./gradlew test assembleDebug
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          APK="Spotiboost-$VER.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          # Notes: the "## Spotiboost vX.Y.Z" section of CHANGE.md (English and Spanish blocks, the app shows the one in the
          # user's language). Without an entry, fall back to the commit subjects since the previous tag.
          awk -v h="## Spotiboost $GITHUB_REF_NAME" '$0==h{p=1;next} /^## /{p=0} p' CHANGE.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            git log --no-merges --pretty='- %s' ${PREV:+"$PREV..$GITHUB_REF_NAME"} > "$RUNNER_TEMP/notes.md"
          fi
          # after the "---" line: only for the GitHub page, the app does not show it
          {
            printf '\n---\n'
            printf 'Install the APK (arm64 only); SHA-256 in the .sha256 file. / Instala el APK (solo arm64); SHA-256 en el archivo .sha256.\n'
            if [ "$SIGNED" = debug ]; then
              printf '\nSigned with the debug key: it installs but cannot update over a build signed with another key. / Firmado con la clave de depuración: instala pero no actualiza encima de otra firma.\n'
            fi
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "Spotiboost $VER" --notes-file "$RUNNER_TEMP/notes.md"
