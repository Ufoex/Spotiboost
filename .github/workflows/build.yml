name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release on a tag
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # compileSdk 36; the runner image may only ship older platforms
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Release key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease -PversionNameOverride="${GITHUB_REF_NAME#v}"
          else
            ./gradlew assembleDebug
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          APK="Spotiboost-$VER.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          NOTES="Instala el APK (solo arm64). SHA-256 en el archivo .sha256."
          if [ "$SIGNED" = debug ]; then
            NOTES="$NOTES"$'\n\n'"Firmado con la clave de depuración: instala, pero no actualiza encima de una versión firmada con otra clave."
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "Spotiboost $VER" --notes "$NOTES"
